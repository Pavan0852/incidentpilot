
name: Publish IncidentPilot API Image

on:
  push:
    tags:
      - "api-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Extract backend image version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/api-v* ]]; then
            VERSION="${GITHUB_REF_NAME#api-v}"
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/pavan0852/incidentpilot-api:${{ steps.meta.outputs.version }}
            ghcr.io/pavan0852/incidentpilot-api:sha-${{ github.sha }}
